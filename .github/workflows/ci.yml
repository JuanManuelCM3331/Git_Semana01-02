name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Fix jest permissions
        run: chmod +x ./node_modules/.bin/jest

      - name: Run tests
        run: npm test

      - name: Run Prettier
        run: npx prettier --check .

      - name: Update test file
        run: |
          FILE_PATH="ruta/al/archivo/de/prueba.js"
          if [ -f "$FILE_PATH" ]; then
            sed -i 's|const suma = require("../suma");|const { suma } = require("../features/calculadora");|' "$FILE_PATH"
          else
            echo "El archivo de prueba no existe en la ruta especificada."
          fi

      - name: Create wrapper suma.js
        run: |
          cat > ./suma.js <<'EOF'
          const { suma } = require('./features/calculadora');
          module.exports = suma;
          EOF
